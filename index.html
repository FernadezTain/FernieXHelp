<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Центр Поддержки FernieX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">Центр Поддержки FernieX</div>

<div class="scene">
    <div class="card active-main" id="card">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="card-face card-main">
            <h1>Центр Поддержки</h1>
            <p>Выберите действие</p>
            <button class="btn" id="startBtn">Начать</button>
        </div>

        <!-- ВЫБОР ДЕЙСТВИЯ -->
        <div class="card-face card-menu">
            <h2>Выберите действие</h2>
            <div class="menu-buttons">
                <button class="menu-btn" id="checkStatusBtn">Проверить статус обращения</button>
                <button class="menu-btn success" id="createBtn">Создать обращение</button>
            </div>
            <div class="buttons" style="margin-top: 20px;">
                <button class="btn" id="backToMainBtn">Назад</button>
            </div>
        </div>

        <!-- ВВОД НОМЕРА ОБРАЩЕНИЯ -->
        <div class="card-face card-check">
            <h2>Проверка статуса обращения</h2>
            <p>Введите номер обращения</p>
            <input type="text" id="ticketInput" placeholder="№ обращения">
            <div class="buttons">
                <button class="btn" id="checkBackBtn">Назад</button>
                <button class="btn success" id="checkBtn">Проверить</button>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТ ПОИСКА И ЗАГРУЗКА -->
        <div class="card-face card-loading">
            <div id="loadingContent">
                <h2>Поиск обращения...</h2>
                <div class="loading-spinner"></div>
                <div class="loading-text" id="loadingText"></div>
                <div class="buttons" style="margin-top: 20px;">
                    <button class="btn danger" id="cancelBtn">Отменить поиск</button>
                </div>
            </div>

            <div id="resultContent" style="display: none; width: 100%; max-height: 100%; overflow-y: auto;">
                <div class="result-header">
                    <h2 id="ticketNumber">Обращение №</h2>
                </div>
                <div class="result-info">
                    <div class="info-row">
                        <span class="info-label">Пользователь:</span>
                        <span class="info-value" id="resultUser">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Администратор:</span>
                        <span class="info-value" id="resultAdmin">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Создано:</span>
                        <span class="info-value" id="resultDate">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Статус:</span>
                        <span class="info-value" id="resultStatus">-</span>
                    </div>
                </div>
                <p style="text-align: left; margin: 10px 0; color: #aaa; font-size: 13px;">Отслеживание:</p>
                <div class="timeline" id="timeline"></div>
                <div class="buttons">
                    <button class="btn" id="resultBackBtn">Назад</button>
                </div>
            </div>
        </div>

        <!-- СОЗДАНИЕ ОБРАЩЕНИЯ -->
        <div class="card-face card-create">
            <h2>Создание обращения</h2>
            <input type="text" id="nickInput" placeholder="Введите ваш Nick" style="width: 85%;">
            <select id="typeSelect" style="width: 85%;">
                <option value="">Выберите тип обращения</option>
                <option value="bug">Баг / Ошибка</option>
                <option value="suggest">Предложение</option>
                <option value="question">Вопрос</option>
                <option value="complaint">Жалоба</option>
                <option value="other">Другое</option>
            </select>
            <div class="buttons">
                <button class="btn" id="createBackBtn">Назад</button>
                <button class="btn success" id="createSubmitBtn">Создать</button>
            </div>
        </div>
    </div>   
</div>

<div id="notification-container"></div>
<div id="error-banner">
    <span id="error-message">Ошибка</span>
    <div class="close-btn"></div>
</div>

<script src="script.js"></script>
</body>
</html>
